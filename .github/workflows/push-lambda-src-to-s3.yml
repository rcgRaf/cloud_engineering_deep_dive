name: Deploy Lambda to S3

on:
  push:
    branches:
      - main  # Trigger the workflow on pushes to the `main` branch

jobs:
  deploy-lambda:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Set up AWS CLI
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1 # Change this if your S3 bucket is in another region

    # Step 3: Zip the Lambda code
    - name: Zip Lambda Code
      run: |
        mkdir -p build
        zip -j build/lambda.zip src/lambda/index.js

    # Step 4: Upload to S3
    - name: Upload to S3
      run: |
        aws s3 cp build/lambda.zip s3://rcgrafbucket/lambda.zip
